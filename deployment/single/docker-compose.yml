services:
  mongo:
    container_name: mongodb
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-cluster:/data/configdb
    environment:
      LANG: C.UTF-8
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - cloud-geo

  cloud-geo-py:
    container_name: cloud-geo-py
    image: swsk33/cloud-geo-py
    ports:
      - 5000:5000
    volumes:
      - pywps-data:/workdir
    environment:
      SERVER_HOST: ${SERVER_HOST} # This is the IP for the PyWPS server
      SERVER_PORT: 5000
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      DEPLOY_MODE: single
    networks:
      - cloud-geo

  cloud-geo-nginx:
    container_name: cloud-geo-nginx-single
    image: swsk33/cloud-geo-nginx:single-1.0.0
    ports:
      - 80:80
    volumes:
      - nginx-conf:/etc/nginx
    depends_on:
      - cloud-geo-py
    networks:
      - cloud-geo

volumes:
  mongo-data-test:
  mongo-cluster-test:
  pywps-data:
  nginx-conf:


networks:
  cloud-geo:
