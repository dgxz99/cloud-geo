{{- range $i := until (int .Values.pyService.replicas) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-geo.fullname" $ }}-py-{{ add $i 1 }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloud-geo.name" $ }}-py-{{ add $i 1 }}
  template:
    metadata:
      labels:
        app: {{ include "cloud-geo.name" $ }}-py-{{ add $i 1 }}
    spec:
      containers:
      - name: py-service
        image: {{ $.Values.pyService.image }}
        imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ $.Values.pyService.port }}
        env:
        - name: MONGO_HOST
          value: {{ include "cloud-geo.fullname" $ }}-mongodb
        - name: MONGO_USERNAME
          value: {{ $.Values.mongodb.rootUsername | quote }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "cloud-geo.fullname" $ }}-secret
              key: mongo-root-password
        - name: REDIS_HOST
          value: {{ include "cloud-geo.fullname" $ }}-redis
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "cloud-geo.fullname" $ }}-secret
              key: redis-password
        - name: CONSUL_IP
          value: {{ include "cloud-geo.fullname" $ }}-consul
        - name: CONSUL_SERVICE_IP
          value: {{ include "cloud-geo.fullname" $ }}-py-{{ add $i 1 }}
        - name: FILE_SERVER_URL
          value: "http://{{ include "cloud-geo.fullname" $ }}-gateway:{{ $.Values.gateway.port }}/api/file"
        - name: DEPLOY_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "cloud-geo.fullname" $ }}-config
              key: DEPLOY_MODE
        # volumeMounts:
        # - name: py-data
        #   mountPath: /workdir
      # volumes:
      # - name: py-data
      #   persistentVolumeClaim:
      #     claimName: {{ include "cloud-geo.fullname" $ }}-py-{{ add $i 1 }}-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-geo.fullname" $ }}-py-{{ add $i 1 }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: {{ include "cloud-geo.name" $ }}-py-{{ add $i 1 }}
  ports:
  - port: {{ add 5000 $i }}
    targetPort: {{ $.Values.pyService.port }}
  type: {{ $.Values.service.type }}
{{- end }}
