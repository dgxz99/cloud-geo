apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-geo.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cloud-geo.name" . }}-minio
  template:
    metadata:
      labels:
        app: {{ include "cloud-geo.name" . }}-minio
    spec:
      containers:
      - name: minio
        image: {{ .Values.minio.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.minio.port }}
        - containerPort: {{ .Values.minio.consolePort }}
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.rootUser | quote }}
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "cloud-geo.fullname" . }}-secret
              key: minio-root-password
        command: ["minio", "server", "/data", "--console-address", ":9001"]
        volumeMounts:
        - name: minio-data
          mountPath: /data
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: {{ include "cloud-geo.fullname" . }}-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-geo.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ include "cloud-geo.name" . }}-minio
  ports:
  - name: api
    port: {{ .Values.minio.port }}
    targetPort: {{ .Values.minio.port }}
  - name: console
    port: {{ .Values.minio.consolePort }}
    targetPort: {{ .Values.minio.consolePort }}
  type: {{ .Values.service.type }}
